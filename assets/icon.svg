<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- Phone outline -->
  <rect x="340" y="160" width="344" height="600" rx="50" fill="none" stroke="url(#blue)" stroke-width="36"/>
  <!-- Screen -->
  <rect x="376" y="220" width="272" height="460" rx="12" fill="#0d1117" opacity="0.6"/>
  <!-- Notch -->
  <rect x="462" y="175" width="100" height="20" rx="10" fill="#0d1117"/>
  <!-- Home bar -->
  <rect x="452" y="720" width="120" height="8" rx="4" fill="#4fc3f7" opacity="0.5"/>
  <!-- Upload arrow -->
  <path d="M512 580 L512 350" stroke="url(#arrow)" stroke-width="40" stroke-linecap="round"/>
  <path d="M420 440 L512 330 L604 440" stroke="url(#arrow)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Deploy dots -->
  <circle cx="430" cy="870" r="22" fill="#4fc3f7" opacity="0.7"/>
  <circle cx="512" cy="870" r="22" fill="#1a73e8"/>
  <circle cx="594" cy="870" r="22" fill="#4fc3f7" opacity="0.7"/>
  <!-- Connection lines from dots -->
  <path d="M430 848 L430 790" stroke="#4fc3f7" stroke-width="4" opacity="0.3"/>
  <path d="M512 848 L512 790" stroke="#1a73e8" stroke-width="4" opacity="0.5"/>
  <path d="M594 848 L594 790" stroke="#4fc3f7" stroke-width="4" opacity="0.3"/>
</svg>
